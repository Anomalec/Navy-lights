<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Vite removes this redirect when serving or building the app. -->
    <meta
      id="source-entry-redirect"
      http-equiv="refresh"
      content="0;url=./docs/?v=2"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#11191d" />
    <meta
      name="description"
      content="Учите огни и знаки судов по МППСС-72. 144 карточки: нажмите, чтобы узнать ответ, смахните, чтобы продолжить."
    />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Огни — морские карточки</title>
  </head>
  <body>
    <div id="root">
      <div
        id="startup"
        role="status"
        style="
          font-family: Arial, sans-serif;
          background: #11191d;
          color: #e5e8e4;
          min-height: 100vh;
          display: grid;
          place-content: center;
          padding: 32px;
          box-sizing: border-box;
          text-align: center;
        "
      >
        <h1 style="font-size: 32px; color: #c7eaa0">Огни</h1>
        <p id="startup-message">Загружаем карточки…</p>
        <p
          id="startup-help"
          style="
            font-size: 14px;
            line-height: 1.8;
            max-width: 440px;
            color: #a6b7ba;
          "
        ></p>
        <button
          id="startup-retry"
          type="button"
          hidden
          style="
            background: #c7eaa0;
            color: #182c22;
            border: 0;
            border-radius: 7px;
            padding: 14px 22px;
            font: inherit;
            cursor: pointer;
            justify-self: center;
          "
        >
          Обновить приложение
        </button>
        <details
          id="startup-diagnostics"
          hidden
          style="
            max-width: 440px;
            margin-top: 24px;
            color: #a6b7ba;
            font-size: 13px;
          "
        >
          <summary>Подробности ошибки</summary>
          <p id="startup-error-detail" style="overflow-wrap: anywhere"></p>
        </details>
      </div>
    </div>
    <noscript>Для тренировки включите JavaScript в браузере.</noscript>
    <script>
      (function () {
        document.body.style.margin = "0";
        document.body.style.background = "#11191d";
        function showStartupError(event) {
          var message = document.getElementById("startup-message");
          var help = document.getElementById("startup-help");
          if (!message || !help) return;
          message.textContent = "Не удалось запустить карточки";
          help.textContent =
            "Нажмите «Обновить приложение», чтобы загрузить свежую версию. Ваш прогресс сохранится.";
          document.getElementById("startup-retry").hidden = false;
          document.getElementById("startup-diagnostics").hidden = false;
          document.getElementById("startup-error-detail").textContent =
            event && event.message
              ? String(event.message).slice(0, 300)
              : event && event.target && event.target.tagName === "SCRIPT"
                ? "Браузер не смог загрузить код приложения."
                : "Загрузка приложения не завершилась.";
        }
        document
          .getElementById("startup-retry")
          .addEventListener("click", function () {
            var url = new URL(location.href);
            url.searchParams.set("v", String(Date.now()));
            location.replace(url.href);
          });
        window.addEventListener("error", showStartupError, true);
        setTimeout(showStartupError, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
